name: ci

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run db:generate
      - run: npm run typecheck
      - run: npm test
      - run: npm run test:experience
      - run: npm run test:eval:core
      - run: npm run build
      - name: Upload failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: verify-failure-${{ github.run_id }}
          if-no-files-found: ignore
          path: |
            coverage/
            playwright-report/
            test-results/

  postgres-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: otter
          POSTGRES_PASSWORD: otter
          POSTGRES_DB: spirit_otter_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U otter -d spirit_otter_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://otter:otter@localhost:5432/spirit_otter_test?schema=public
      TEST_DATABASE_URL: postgresql://otter:otter@localhost:5432/spirit_otter_test?schema=public
      SESSION_SECRET: integration-ci-secret-with-more-than-thirty-two-characters
      COOKIE_SECURE: "false"
      WEB_ORIGIN: http://localhost:3001
      LLM_API_KEY: ""
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm run db:generate
      - run: npm run db:deploy -w @otter/server
      - run: npm run test:integration

  demo-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      E2E_MODE: demo
      E2E_BASE_URL: http://localhost:3001
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: demo-e2e-${{ github.run_id }}
          if-no-files-found: ignore
          path: |
            web/playwright-report/
            web/test-results/
